services:
  web:
    image: ghcr.io/yukugura/img-site:${IMAGE_TAG:-latest}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8088}:8000"
    environment:
      DATA_DIR: /data
      MEDIA_DIR: /storage/media
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - gallery-data:/data
      - ${MEDIA_STORAGE:-gallery-data}:/storage
    restart: unless-stopped
    init: true
    mem_limit: ${WEB_MEMORY_LIMIT:-768m}
    cpus: ${WEB_CPUS:-1.0}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/session', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 15s
      retries: 3
volumes:
  gallery-data:
